# 每次推到 main (或打 v* 标签) 就构建多架构镜像并推到 GHCR。
# 镜像: ghcr.io/mousekane/my-note:latest (main 分支) / ghcr.io/mousekane/my-note:vX.Y.Z (标签)
# 一键安装脚本 install.sh 拉的就是这个镜像。
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (跨架构构建用)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 打版本标签 (v*, 如 v1.0.0) 时, 额外把镜像导出成 tar 包挂到 Release 上,
  # 供 registry 镜像都拉不到时离线导入用 (用法见 README “兜底”一节)。
  release-tar:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (跨架构构建用)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 tar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          outputs: type=docker,dest=/tmp/mynote-linux-amd64.tar

      - name: Build arm64 tar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          outputs: type=docker,dest=/tmp/mynote-linux-arm64.tar

      - name: Upload tars to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/mynote-linux-amd64.tar
            /tmp/mynote-linux-arm64.tar
